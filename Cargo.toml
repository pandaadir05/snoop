[workspace]
members = [
    "snoop",
    "snoop-common",
    "snoop-ebpf",
    "xtask",
]
# `cargo build` / `cargo test` without -p target only these crates.
# xtask and snoop-ebpf are built explicitly via `cargo xtask` or
# `cargo build -p snoop-ebpf --target bpfel-unknown-none`.
default-members = ["snoop", "snoop-common"]
resolver = "2"

# Release profile: LTO + full optimisation.
# Important for the BPF verifier on the eBPF side and binary size on the
# userspace side.
[profile.release]
lto = true
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 1   # avoid extremely slow debug builds on large dep trees

# The BPF verifier on kernel 5.15 (WSL2) follows all code paths including
# panic/unreachable branches.  opt-level >= 2 lets LLVM eliminate those dead
# paths so the verifier never sees the self-loop instruction.
[profile.dev.package.snoop-ebpf]
opt-level = 2
codegen-units = 1

[profile.release.package.snoop-ebpf]
opt-level = 2
codegen-units = 1

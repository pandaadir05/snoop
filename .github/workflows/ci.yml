name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── host checks (fmt + clippy + tests) ────────────────────────────────────
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    # Skip the nightly eBPF build in this job — only stable toolchain is
    # installed here.  build.rs writes an empty stub when this is set so
    # that loader.rs can include_bytes! without failing.
    env:
      SNOOP_SKIP_EBPF_BUILD: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # snoop-ebpf is excluded: it requires a BPF target and nightly toolchain.
        run: cargo clippy --workspace --exclude snoop-ebpf -- -D warnings

      - name: Run tests
        run: cargo test --workspace --exclude snoop-ebpf

  # ── eBPF compilation check ─────────────────────────────────────────────────
  ebpf:
    name: eBPF compile (bpfel-unknown-none)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # BPF targets (bpfel-unknown-none) never ship pre-built rust-std — they
      # are always compiled from source with -Z build-std=core.  Only rust-src
      # is needed; do NOT add `targets:` here or rustup will fail trying to
      # download a component that does not exist.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-ebpf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ebpf-

      # bpf-linker uses bundled LLVM to avoid a system LLVM version dependency.
      # Cache the compiled binary so it is only built once per cache key bump.
      - name: Cache bpf-linker binary
        id: cache-bpf-linker
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-${{ runner.os }}-bundled-v1

      - name: Install bpf-linker
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        run: cargo install bpf-linker --locked

      - name: Compile eBPF programs
        run: cargo xtask build-ebpf

  # ── aarch64 cross-compile check ────────────────────────────────────────────
  cross:
    name: cross-compile aarch64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      # Same note as the ebpf job: BPF targets use -Z build-std=core, so only
      # rust-src is required — no `targets:` field.
      - name: Install Rust nightly (for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-aarch64-

      # bpf-linker cache must be checked before the install step.
      - name: Cache bpf-linker binary
        id: cache-bpf-linker
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-${{ runner.os }}-bundled-v1

      - name: Install bpf-linker
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        run: cargo install bpf-linker --locked

      - name: Build eBPF
        run: cargo xtask build-ebpf --release

      - name: Cross-compile snoop for aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          # Absolute path to the object compiled by the xtask step above.
          # build.rs copies it to OUT_DIR instead of re-invoking nightly cargo.
          SNOOP_EBPF_OBJ: ${{ github.workspace }}/target/bpfel-unknown-none/release/snoop-ebpf
        run: cargo build --package snoop --target aarch64-unknown-linux-musl --release

[package]
name = "snoop-ebpf"
version = "0.1.0"
edition = "2021"
description = "eBPF programs for snoop (compiled for BPF targets)"
license = "MIT OR Apache-2.0"

# This crate is compiled for BPF targets (bpfel-unknown-none / bpfeb-unknown-none)
# when deploying eBPF programs. It is included as a workspace member so that
# IDEs and tooling can resolve types, but a dedicated `cargo build` with
# --target bpfel-unknown-none is required for actual eBPF deployment.
[dependencies]
snoop-common = { path = "../snoop-common" }


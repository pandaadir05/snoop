[package]
name = "snoop-ebpf"
version = "0.1.0"
edition = "2021"
description = "eBPF programs for snoop (syscall tracepoints)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
snoop-common = { path = "../snoop-common" }

# aya-ebpf and aya-log-ebpf only compile for BPF targets.
# The workspace host build (x86_64 / aarch64) skips these.
[target.'cfg(target_arch = "bpf")'.dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"

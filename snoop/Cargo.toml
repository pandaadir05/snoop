[package]
name = "snoop"
version = "0.1.0"
edition = "2021"
description = "A modern syscall tracer for Linux, built on eBPF"
license = "MIT OR Apache-2.0"

[[bin]]
name = "snoop"
path = "src/main.rs"

[dependencies]
snoop-common = { path = "../snoop-common" }

anyhow      = "1"
clap        = { version = "4", features = ["derive", "env"] }
log         = "0.4"
env_logger  = "0.11"
libc        = "0.2"
tokio       = { version = "1", features = ["full"] }
thiserror   = "2"

# TUI
ratatui   = "0.30"
crossterm = "0.29"

# Flamegraph export
inferno = { version = "0.12", default-features = false }

# aya and friends are Linux-only.  On macOS the crate still compiles for
# IDE support; the Linux-gated modules are simply excluded.
[target.'cfg(target_os = "linux")'.dependencies]
aya     = { version = "0.13", features = ["async_tokio"] }
aya-log = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# aya-build runs a sub-cargo that compiles snoop-ebpf for bpfel-unknown-none.
# It is only invoked when building on Linux; on other hosts the build script
# is a no-op.  See build.rs.
aya-build = "0.1"
